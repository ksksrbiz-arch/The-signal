name: SEO maintenance agent

on:
  schedule:
    - cron: '45 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-maintenance-agent
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh sitemap and SEO report
        run: npm run seo:agent

      - name: Commit SEO maintenance updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No SEO changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seo-report.json sitemap.xml
          git commit -m "Refresh SEO maintenance report"
          git push
