name: Archive transmission agent

# Publishes one new long-form dispatch to /archive/ per run, then rebuilds the
# derived indexes and pings IndexNow so it gets crawled quickly.
#
# The agent refuses to publish when a quality gate fails (too short, repeated
# topic, near-duplicate of an existing dispatch, or a possible fabricated
# claim). That is a normal outcome, not a broken workflow: a quiet day costs
# nothing, and a thin page costs the whole site. `continue-on-error` on the
# generate step keeps a refused run from showing up as a red build.

# SCHEDULE PARKED — GitHub Actions is unavailable on this repo right now, so a
# cron here only produces a daily failure. The live publisher is the Claude
# routine described in CLAUDE.md ("Publishing without GitHub Actions"), which
# runs `npm run archive:publish`. Restore the `schedule:` block below when
# Actions work again, and delete the routine so the two do not double-publish.
on:
#   schedule:
#     - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      signal_date:
        description: 'Optional YYYY-MM-DD date override'
        required: false
      topic_id:
        description: 'Optional topic id from scripts/archive-topics.mjs'
        required: false
      dry_run:
        description: 'Generate and gate, but write nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-transmission-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Guards the transformer, the quality gates, and the renderer before any
      # model call, so a bad refactor fails here rather than on a live page.
      - name: Verify agent gates
        run: npm run test:archive

      - name: Generate archive transmission
        id: generate
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_MODEL_LARGE: ${{ vars.GROQ_MODEL_LARGE }}
          GROQ_MODEL_SMALL: ${{ vars.GROQ_MODEL_SMALL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SIGNAL_DATE: ${{ inputs.signal_date }}
          ARCHIVE_TOPIC_ID: ${{ inputs.topic_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: npm run archive:agent

      - name: Report refusal
        if: steps.generate.outcome != 'success'
        run: |
          echo "::notice::The archive agent published nothing this run — a quality gate failed or a provider was unavailable. See the generate step log."

      - name: Rebuild indexes, feeds, and sitemap
        if: steps.generate.outcome == 'success' && inputs.dry_run != true
        run: |
          npm run covers
          npm run index
          npm run blog
          npm run series
          npm run issue
          npm run seo:agent

      - name: Commit and push
        id: commit
        if: steps.generate.outcome == 'success' && inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER=$(node -p "JSON.parse(require('fs').readFileSync('data/archive-state.json','utf8')).published[0].number")
          TITLE=$(node -p "JSON.parse(require('fs').readFileSync('data/archive-state.json','utf8')).published[0].title")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive data images/covers blog sitemap.xml feed.xml feed.json
          git commit -m "Publish archive transmission №${NUMBER}: ${TITLE}"
          # The daily content agent pushes to main too; rebase rather than fail
          # if it landed a commit between our checkout and this push.
          for attempt in 1 2 3 4; do
            if git push; then break; fi
            sleep $((2 ** attempt))
            git pull --rebase origin main
          done
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      # Best-effort crawl notification. Waits for Netlify to serve the new page
      # before submitting, and never fails the run.
      - name: Ping IndexNow
        if: steps.commit.outputs.published == 'true'
        continue-on-error: true
        run: |
          BASE="https://1commercesolutions.com"
          PAGE="$BASE/archive/${{ steps.commit.outputs.number }}.html"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$PAGE")
            if [ "$code" = "200" ]; then echo "Live after ${i} check(s): $PAGE"; break; fi
            sleep 15
          done
          npm run indexnow -- "$PAGE" "$BASE/archive/" "$BASE/blog/"
